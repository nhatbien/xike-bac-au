# Builds the iOS app and uploads it to TestFlight (App Store Connect app 6838730847,
# team "Mai bien" 25HT4D9Y9Q, bundle id com.biestudio.xikebacau).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   IOS_DIST_CERT_P12_BASE64   base64 of the Apple Distribution certificate + private key (.p12)
#   IOS_DIST_CERT_PASSWORD     password of that .p12
#   IOS_APPSTORE_PROFILE_BASE64 base64 of the App Store provisioning profile (.mobileprovision)
#   ASC_KEY_ID                 App Store Connect API key ID (App Manager role is enough)
#   ASC_ISSUER_ID              App Store Connect issuer ID
#   ASC_API_KEY_P8_BASE64      base64 of the AuthKey_<ASC_KEY_ID>.p8 file
#
# The build number is github.run_number + BUILD_NUMBER_OFFSET; the version name comes
# from pubspec.yaml. Build 1 was uploaded by hand, so the offset starts at 1.
name: iOS TestFlight

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  BUILD_NUMBER_OFFSET: "1"

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          flutter --version

      - name: Install signing certificate and profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/appstore.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME"

      - name: Switch Runner to manual distribution signing (CI only)
        run: |
          set -euo pipefail
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 25HT4D9Y9Q
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>25HT4D9Y9Q</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.biestudio.xikebacau</key><string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build IPA
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build ipa --release --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ls -la build/ios/ipa

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/profile.plist
